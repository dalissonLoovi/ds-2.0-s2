name: Storybook

on:
  push:
    branches: [main, master]
    paths:
      - 'storybook/**'
      - 'packages/**'
      - 'design-system-tokens.storybook.updated.v2.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storybook.yml'
  pull_request:
    paths:
      - 'storybook/**'
      - 'packages/**'
      - 'design-system-tokens.storybook.updated.v2.json'
      - 'package.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-storybook
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run tokens:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:variants

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run tokens:build
      - name: Generate docs + build Storybook
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build-storybook -w @ds/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook/storybook-static

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
